# Juscribe SOP enforcement hooks for Kimi Code (#1977).
#
# Kimi Code reads hooks ONLY from ~/.kimi-code/config.toml (no project-level
# config) — append this file's rules there, or install the whole bundle as a
# Kimi plugin instead (kimi.plugin.json at the bundle root carries the same
# rules with plugin-relative paths; see hooks/kimi-code/README.md).
#
# Every command is `jus hook <name>` (#4759) — jus resolves the bundle at run
# time, so no path is baked in here and `jus` has to be on PATH where Kimi
# spawns a hook. [[hooks]] accepts ONLY
# event / matcher / command / timeout — extra keys fail the whole config load.
# The Stop rule deliberately has no matcher: Kimi matches Stop against an
# empty string, so any non-empty matcher would never fire.

[[hooks]]
event = "PreToolUse"
matcher = "^Bash$"
command = "jus hook jus-block-force-push"
timeout = 10

[[hooks]]
event = "PreToolUse"
matcher = "^Bash$"
command = "jus hook jus-block-no-verify"
timeout = 10

[[hooks]]
event = "PreToolUse"
matcher = "^Bash$"
command = "jus hook jus-pre-commit-gate"
timeout = 10

[[hooks]]
event = "PreToolUse"
matcher = "^Bash$"
command = "jus hook jus-block-accepted-manifest-edit"
timeout = 10

[[hooks]]
event = "PreToolUse"
matcher = "^Bash$"
command = "jus hook jus-blocker-date-nudge"
timeout = 10

[[hooks]]
event = "PreToolUse"
matcher = "^(Edit|Write)$"
command = "jus hook --adapt kimi-code jus-block-lint-suppression"
timeout = 10

[[hooks]]
event = "PostToolUse"
matcher = "^Bash$"
command = "jus hook jus-post-bash-tracker"
timeout = 10

[[hooks]]
event = "PostToolUse"
matcher = "^(Edit|Write)$"
command = "jus hook --adapt kimi-code jus-track-edits"
timeout = 10

[[hooks]]
event = "UserPromptSubmit"
command = "jus hook kimi-code/jus-kimi-prompt-nudge"
timeout = 10

[[hooks]]
event = "UserPromptSubmit"
command = "jus hook jus-ticket-claim-nudge"
timeout = 10

[[hooks]]
event = "Stop"
command = "jus hook jus-stop-uncommitted"
timeout = 15
